<!DOCTYPE html>
<html>
<head>
    <title>Approved Companies</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Approved Companies</h1>

    {% if approved_companies %}
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Details</th>
                <th>Approved At</th>
                <th>Dashboard</th>
            </tr>
        </thead>
        <tbody>
            {% for company in approved_companies %}
            <tr>
                <td>{{ company.name }}</td>
                <td>{{ company.email }}</td>
                <td>{{ company.details }}</td>
                <td>{{ company.approved_at }}</td>
                <td>
                    <a href="{% url 'company_dashboard' company.id %}" class="btn btn-primary btn-sm">
                        View Dashboard
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-muted">No companies approved yet.</p>
    {% endif %}
</body>
</html>
