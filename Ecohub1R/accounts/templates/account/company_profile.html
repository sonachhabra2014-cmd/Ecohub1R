<!DOCTYPE html>
<html>
<head>
    <title>{{ company.name }} Profile</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">{{ company.name }} Profile</h1>

    <div class="card">
        <div class="card-body">
            <h5>Company Details</h5>
            <p><b>Name:</b> {{ company.name }}</p>
            <p><b>Email:</b> {{ company.email }}</p>
            <p><b>Details:</b> {{ company.details }}</p>
            <p><b>Verified:</b> {{ company.verified }}</p>
            <p><b>Approved At:</b> {{ company.approved_at }}</p>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'company_dashboard' company.id %}" class="btn btn-primary">
            Go to Dashboard
        </a>
    </div>
</body>
</html>
