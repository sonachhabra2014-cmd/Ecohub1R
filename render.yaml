services:
  - type: web
    name: ecohub-api
    runtime: python
    rootDir: Ecohub1R
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: ecohub-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: ecohub-db
          property: connectionString

databases:
  - name: ecohub-db
    databaseName: ecohub
    user: ecohub
    plan: free
    postgresMajorVersion: "18"
